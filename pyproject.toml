[project]
name = "coop-disaster"
version = "0.1.0"
requires-python = ">=3.13"
description = "Python ABM replicating Jonsson & Jonsson (2025) — cooperation under disaster risk"
dependencies = [
    "matplotlib>=3.8",
    "mesa>=3.0",
    "networkx>=3.0",
    "numpy>=1.26",
]

[project.scripts]
coop-disaster = "coop_disaster.__main__:main"

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coop_disaster", "src/condcoop"]
