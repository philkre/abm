[project]
name = "coop-disaster"
version = "0.1.0"
requires-python = ">=3.13"
description = "Spatial agent-based model of collective flood defence under resilience-erosion feedback"
dependencies = [
    "click>=8.1",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "mesa>=3.0",
    "networkx>=3.0",
    "numba>=0.65.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "salib>=1.5",
    "scienceplots>=2.0",
    "scipy>=1.12",
    "tqdm>=4.65",
]

[project.scripts]
spatcoop = "spatcoop.cli:cli"

[dependency-groups]
dev = [
    "black>=24.0",
    "markitdown[pdf]>=0.1.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condcoop", "src/spatcoop"]
